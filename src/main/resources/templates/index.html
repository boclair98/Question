<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>면접 시뮬레이션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body
        th:attr="data-login-status=${loginUser != null} ? 'true' : 'false'"
        class="bg-gradient-to-r from-blue-400 via-blue-600 to-indigo-700 min-h-screen flex items-center justify-center relative px-4">

<!-- 상단 우측 버튼들 -->
<div class="absolute top-6 right-6 flex space-x-4">

    <!-- 로그인 되어 있지 않은 경우 -->
    <div th:if="${loginUser == null}">
        <form action="/login" method="get" class="inline-block">
            <button type="submit"
                    class="flex items-center space-x-2 bg-white text-blue-700 font-semibold py-2 px-5 rounded-lg shadow hover:bg-blue-50 transition focus:outline-none focus:ring-2 focus:ring-blue-300">
                <i data-feather="log-in" class="w-5 h-5"></i>
                <span>로그인</span>
            </button>
        </form>
    </div>

    <!-- 로그인된 경우 -->
    <div th:if="${loginUser != null}" class="flex items-center space-x-4">
        <span class="text-white font-semibold text-lg" th:text="'안녕하세요, ' + ${loginUser.name} + '님!'">안녕하세요, 사용자님!</span>

        <form action="/logout" method="post" class="inline-block">
            <button type="submit"
                    class="flex items-center space-x-2 bg-white text-blue-700 font-semibold py-2 px-5 rounded-lg shadow hover:bg-blue-50 transition focus:outline-none focus:ring-2 focus:ring-blue-300">
                <i data-feather="log-out" class="w-5 h-5"></i>
                <span>로그아웃</span>
            </button>
        </form>
    </div>

    <!-- 질문 추가 버튼 -->
    <button onclick="goToAddQuestion()"
            class="flex items-center space-x-2 bg-yellow-400 hover:bg-yellow-500 text-white font-semibold py-2 px-5 rounded-lg shadow transition focus:outline-none focus:ring-2 focus:ring-yellow-300">
        <i data-feather="plus" class="w-5 h-5"></i>
        <span>질문 추가하기</span>
    </button>
</div>

<!-- 메인 컨테이너 -->
<div class="bg-white rounded-2xl shadow-2xl p-12 max-w-lg w-full text-center">
    <h1 class="text-5xl font-extrabold mb-8 text-gray-900 select-none">면접 시뮬레이션</h1>

    <!-- 로그인 실패 시 에러 메시지 표시 -->
    <p th:if="${error}" class="text-red-600 font-semibold mb-4" th:text="${error}">에러 메시지</p>

    <form action="/start-interview" method="POST" id="interviewForm" class="space-y-6">
        <label for="job" class="block text-left text-gray-700 font-semibold text-lg">면접 직무를 선택하세요</label>
        <select name="job" id="job" required
                class="w-full border border-gray-300 rounded-lg p-4 text-gray-800 text-lg focus:outline-none focus:ring-4 focus:ring-blue-300">
            <option value="" disabled selected>직무 선택</option>
            <option value="developer">개발자</option>
            <option value="designer">디자이너</option>
            <option value="marketing">마케팅</option>
            <option value="sales">영업</option>
            <option value="semiconductor">반도체 엔지니어</option>
        </select>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg shadow-lg transition transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-blue-400">
            면접 시작하기
        </button>
    </form>
</div>

<script>
    function goToAddQuestion() {
        // dataset 속성은 문자열이므로 'true'와 정확히 비교해야 합니다
        const isLoggedIn = document.body.dataset.loginStatus === "true";
        console.log('login status:', document.body.dataset.loginStatus);
        if (isLoggedIn) {
            if (confirm("로그인이 완료되었습니다. 질문을 추가할까요?")) {
                window.location.href = "/add-question";  // 질문 추가 페이지 경로로 이동
            }
        } else {
            alert("로그인을 해주셔야 합니다.");
            window.location.href = "/login";
        }
    }

    feather.replace();
</script>

</body>
</html>
