<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>회원가입</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-green-200 via-teal-300 to-cyan-400 min-h-screen flex items-center justify-center">

<div class="bg-white rounded-xl shadow-xl p-10 max-w-md w-full">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">회원가입</h2>

    <form th:action="@{/signup}" method="POST" th:object="${user}" class="space-y-5">
        <div>
            <label for="name" class="block text-left text-gray-700 font-medium mb-1">이름</label>
            <input type="text" id="name" th:field="*{name}" required
                   class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-400" />
            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-600 text-sm mt-1"></p>
        </div>

        <div>
            <label for="email" class="block text-left text-gray-700 font-medium mb-1">이메일</label>
            <input type="email" id="email" th:field="*{email}" required placeholder="example@example.com"
                   class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-400" />
            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-600 text-sm mt-1"></p>
        </div>

        <div>
            <label for="password" class="block text-left text-gray-700 font-medium mb-1">비밀번호</label>
            <input type="password" id="password" th:field="*{password}" required
                   class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-400" />
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-600 text-sm mt-1"></p>
        </div>

        <div>
            <label for="gender" class="block text-left text-gray-700 font-medium mb-1">성별</label>
            <select id="gender" th:field="*{gender}" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-md text-gray-700 focus:outline-none focus:ring-2 focus:ring-green-400">
                <option value="" disabled th:text="${user.gender} == null ? '성별 선택' : ''" selected></option>
                <option value="MALE" th:selected="${user.gender == 'MALE'}">남성</option>
                <option value="FEMALE" th:selected="${user.gender == 'FEMALE'}">여성</option>
            </select>
            <p th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}" class="text-red-600 text-sm mt-1"></p>
        </div>

        <div>
            <label for="job" class="block text-left text-gray-700 font-medium mb-1">직무</label>
            <select id="job" th:field="*{job}" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-md text-gray-700 focus:outline-none focus:ring-2 focus:ring-green-400">
                <option value="" disabled th:text="${user.job} == null ? '직무 선택' : ''" selected></option>
                <option value="DEVELOPER" th:selected="${user.job == 'DEVELOPER'}">개발자</option>
                <option value="DESIGNER" th:selected="${user.job == 'DESIGNER'}">디자이너</option>
                <option value="MARKETING" th:selected="${user.job == 'MARKETING'}">마케팅</option>
                <option value="SALES" th:selected="${user.job == 'SALES'}">영업</option>
            </select>
            <p th:if="${#fields.hasErrors('job')}" th:errors="*{job}" class="text-red-600 text-sm mt-1"></p>
        </div>

        <!-- 기존 직무 다음에 추가 -->

        <div>
            <label for="career" class="block text-left text-gray-700 font-medium mb-1">경력</label>
            <select id="career" th:field="*{career}" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-md text-gray-700 focus:outline-none focus:ring-2 focus:ring-green-400">
                <option value="" disabled th:text="${user.career} == null ? '경력 선택' : ''" selected></option>
                <option value="JUNIOR" th:selected="${user.career == 'JUNIOR'}">신입</option>
                <option value="SENIOR" th:selected="${user.career == 'SENIOR'}">경력</option>
            </select>
            <p th:if="${#fields.hasErrors('career')}" th:errors="*{career}" class="text-red-600 text-sm mt-1"></p>
        </div>


        <div>
            <label for="phone" class="block text-left text-gray-700 font-medium mb-1">전화번호</label>
            <input type="tel" id="phone" th:field="*{phone}" required placeholder="010-1234-5678"
                   class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-400" />
            <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-red-600 text-sm mt-1"></p>
        </div>

        <div>
            <label for="age" class="block text-left text-gray-700 font-medium mb-1">나이</label>
            <input type="number" id="age" th:field="*{age}" min="0" required
                   class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-400" />
            <p th:if="${#fields.hasErrors('age')}" th:errors="*{age}" class="text-red-600 text-sm mt-1"></p>
        </div>

        <button type="submit"
                class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-md transition">
            회원가입
        </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-600">
        이미 계정이 있으신가요?
        <a href="/login" class="text-green-700 hover:underline font-medium">로그인</a>
    </p>
</div>

</body>
</html>
