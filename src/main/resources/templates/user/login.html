<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-indigo-300 via-purple-300 to-pink-300 min-h-screen flex items-center justify-center">

<div class="bg-white rounded-xl shadow-xl p-10 max-w-sm w-full">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">로그인</h2>

    <!-- 에러 메시지 표시 -->
    <p th:if="${error}" th:text="${error}"
       class="text-red-600 font-semibold mb-4 text-center">에러 메시지</p>

    <form action="/login" method="POST" class="space-y-5">
        <div>
            <label for="email" class="block text-left text-gray-700 font-medium mb-1">이메일</label>
            <input type="email" id="email" name="email" required
                   class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>

        <div>
            <label for="password" class="block text-left text-gray-700 font-medium mb-1">비밀번호</label>
            <input type="password" id="password" name="password" required
                   class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>

        <button type="submit"
                class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-3 rounded-md transition">
            로그인
        </button>
    </form>

    <form action="/signup" method="get" class="mt-6">
        <button type="submit"
                class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 rounded-md transition">
            회원가입 하러 가기
        </button>
    </form>
</div>

</body>
</html>
